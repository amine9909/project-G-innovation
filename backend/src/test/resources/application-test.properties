spring.datasource.url=jdbc:h2:mem:employee_management_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.local
spring.mail.password=test-mail-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

app.jwt.secret=test-jwt-secret-value-that-is-long-enough-for-hmac-signing-1234567890
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.cookie-secure=false

app.frontend.url=http://localhost:5173
app.password-reset.expiration-ms=1800000

app.minio.endpoint=http://localhost:9000
app.minio.access-key=test-minio-access-key
app.minio.secret-key=test-minio-secret-key
app.minio.bucket=employee-files
app.minio.verify-connection=false

APP_ADMIN1_PASSWORD=test-admin-one-password
APP_ADMIN2_PASSWORD=test-admin-two-password
